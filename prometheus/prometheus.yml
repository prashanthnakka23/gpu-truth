global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: gpu-truth

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Real hardware. dcgm-exporter must run with profiling fields enabled,
  # otherwise DCGM_FI_PROF_* never appears and every panel here is empty.
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          source: hardware

  # No GPU to hand. Same metric names, same semantics.
  - job_name: dcgm-mock
    static_configs:
      - targets: ["mock-dcgm:9400"]
        labels:
          source: mock
